# Compile DDS-AD9850 for Arduino Uno (ATmega328, same target as lab build).
# Does not upload or run on hardware.

name: Compile

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/buxtronix/arduino.git /tmp/buxtronix-arduino
          cp -r /tmp/buxtronix-arduino/libraries/Rotary "$HOME/Arduino/libraries/Rotary"

      - name: Prepare sketch folder
        run: |
          mkdir -p _ci_sketch/dds_ad9850
          cp dds_ad9850 _ci_sketch/dds_ad9850/dds_ad9850.ino

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn arduino:avr:uno _ci_sketch/dds_ad9850
